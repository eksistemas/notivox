<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08162f">
<title>Notivox · Entrar</title><link rel="icon" type="image/png" href="/icons/app-192.png"><script src="/theme.js"></script><link rel="stylesheet" href="/styles.css"><script defer src="/login.js"></script>
</head>
<body class="login-body">
<main class="login-layout">
<a class="login-brand" href="/login" aria-label="Notivox · entrar"><img src="/icons/app-192.png" alt="" width="42" height="42"><span>Notivox</span></a>
<section class="login-card" aria-labelledby="login-title">
<p class="login-kicker" id="login-kicker">ESPAÇO DO MÚSICO</p>
<h1 id="login-title">Seu repertório.<br>Sem complicação.</h1>
<p class="login-copy" id="login-description">Entre para encontrar suas músicas e seus materiais.</p>
<form id="login-form">
<label id="identity-label" for="identity">E-mail ou usuário</label>
<input id="identity" name="username" type="text" autocomplete="username" required minlength="3" maxlength="254" placeholder="Seu e-mail ou usuário">
<label for="password">Senha</label>
<div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="Sua senha"><button id="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div>
<div id="confirm-field" hidden><label for="confirm">Confirmar senha</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128"></div>
<p id="login-error" role="alert" aria-live="assertive"></p>
<button class="button login-submit" id="login-submit" type="submit">Entrar</button>
</form>
<p class="login-foot" id="login-foot">Problemas para entrar? Fale com o administrador do seu acervo.</p>
</section>
</main>
</body>
</html>
