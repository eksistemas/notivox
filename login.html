<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notivox — Entrar</title><link rel="icon" type="image/png" href="/icons/app-192.png"><script src="/theme.js"></script><link rel="stylesheet" href="/styles.css"><script defer src="/login.js"></script></head><body class="login-body"><main class="login-layout"><div class="login-identity"><img class="notivox-login-logo" src="/assets/logo.png" alt="Notivox — Toda a sua música em um só lugar" width="320" height="320"><div class="eyebrow">NOTIVOX</div><h1>Suas músicas.<br>Um único acervo.</h1><p>Partituras, cifras e materiais para acompanhar suas músicas.</p></div><section class="login-card"><span class="tag">ACESSO AO ACERVO</span><div class="login-modes" role="group" aria-label="Tipo de acesso"><button type="button" id="member-mode" aria-pressed="true">Usuário</button><button type="button" id="admin-mode" aria-pressed="false">Administrador</button></div><div id="member-access"><h2>Entrar no acervo</h2><p>Entre com o e-mail cadastrado pelo administrador.</p><form id="email-form"><label>E-mail<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="Seu e-mail cadastrado"></label><p id="email-error" role="alert"></p><button class="button" type="submit">Acessar materiais</button></form></div><div id="admin-access" hidden><h2 id="login-title">Acesso do administrador</h2><p id="login-description">Use seu usuário e senha para continuar.</p><form id="login-form"><label>Usuário<input name="username" autocomplete="username" minlength="3" maxlength="40" required placeholder="Seu usuário"></label><label>Senha<input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="Sua senha"></label><label id="confirm-field" hidden>Confirmar senha<input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128"></label><p id="login-error" role="alert"></p><button class="button" id="login-submit">Entrar →</button></form></div><p class="login-foot">Notivox</p></section></main></body></html>
